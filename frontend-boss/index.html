<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Proyectos - API Final Boss</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">🚀 Final Boss API</div>
        <div id="user-header" class="user-info hidden">
            <span>Usuario: <strong id="current-user-name">--</strong></span>
            <span id="current-user-role" class="user-badge">ROLE_USER</span>
            <button id="logout-btn" class="btn btn-secondary btn-sm">Cerrar Sesión</button>
        </div>
    </header>

    <div class="container">

        <!-- Sección de Autenticación -->
        <section id="auth-section" class="card auth-container">
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active">Iniciar Sesión</button>
                <button id="tab-register" class="tab-btn">Registrarse</button>
            </div>

            <div id="auth-alert" class="alert hidden"></div>

            <!-- Formulario Login -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" placeholder="ejemplo@empresa.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
            </form>

            <!-- Formulario Registro -->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo</label>
                    <input type="text" id="reg-nombre" class="form-control" placeholder="Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="juan@empresa.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña (Mínimo 6 caracteres)</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="reg-rol">Rol Solicitado</label>
                    <select id="reg-rol" class="form-control">
                        <option value="ROLE_USER">ROLE_USER</option>
                        <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Registrar Cuenta</button>
            </form>
        </section>

        <!-- Sección Principal Dashboard -->
        <section id="main-section" class="hidden">
            <nav class="nav-tabs">
                <a href="#" id="nav-proyectos" class="nav-link active">Proyectos</a>
                <a href="#" id="nav-usuarios" class="nav-link">Usuarios</a>
            </nav>

            <!-- Vista Proyectos -->
            <div id="view-proyectos" class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2>Listado de Proyectos</h2>
                    <button id="btn-new-proyecto" class="btn btn-primary">+ Nuevo Proyecto</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre Proyecto</th>
                                <th>Descripción</th>
                                <th>Presupuesto</th>
                                <th>Estado</th>
                                <th>Responsable</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="proyectos-table-body">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Vista Usuarios -->
            <div id="view-usuarios" class="card hidden">
                <h2>Gestión de Usuarios</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Fecha Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuarios-table-body">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>

    <!-- Modal Formulario Proyecto -->
    <div id="proyecto-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Nuevo Proyecto</h3>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <form id="proyecto-form">
                <input type="hidden" id="proyecto-id">
                <div class="form-group">
                    <label for="nombreProyecto">Nombre del Proyecto *</label>
                    <input type="text" id="nombreProyecto" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="presupuesto">Presupuesto ($) *</label>
                    <input type="number" id="presupuesto" class="form-control" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" class="form-control">
                        <option value="PENDIENTE">PENDIENTE</option>
                        <option value="EN_PROGRESO">EN_PROGRESO</option>
                        <option value="COMPLETADO">COMPLETADO</option>
                        <option value="CANCELADO">CANCELADO</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Cambiar Rol Usuario -->
    <div id="rol-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cambiar Rol de Usuario</h3>
                <button id="close-rol-modal" class="close-btn">&times;</button>
            </div>
            <form id="rol-form">
                <input type="hidden" id="rol-user-id">
                <div class="form-group">
                    <label for="nuevoRol">Seleccionar Nuevo Rol *</label>
                    <select id="nuevoRol" class="form-control" required>
                        <option value="ROLE_USER">ROLE_USER</option>
                        <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Actualizar Rol</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
