<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Eventos - Sistema de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Sistema Eventos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clientes.html">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="salones.html">Salones</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Notification Alert -->
        <div id="alert-message" class="alert d-none" role="alert"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0 text-primary">Gestión de Eventos</h4>
                <button id="btn-nuevo-evento" class="btn btn-primary">Nuevo Evento</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre Evento</th>
                                <th>Cliente</th>
                                <th>Salón</th>
                                <th>Fecha</th>
                                <th>Personas</th>
                                <th>Horas</th>
                                <th>Estado</th>
                                <th>Total Pago</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="eventos-table-body">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Formulario Evento -->
    <div class="modal fade" id="eventoModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nuevo Evento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="evento-form">
                    <div class="modal-body">
                        <input type="hidden" id="evento-id">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="idCliente" class="form-label">Cliente *</label>
                                <select id="idCliente" class="form-select" required>
                                    <option value="">Seleccione un cliente...</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="idSalon" class="form-label">Salón *</label>
                                <select id="idSalon" class="form-select" required>
                                    <option value="">Seleccione un salón...</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="nombreEvento" class="form-label">Nombre del Evento *</label>
                                <input type="text" id="nombreEvento" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="fechaEvento" class="form-label">Fecha del Evento *</label>
                                <input type="date" id="fechaEvento" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label for="cantidadPersonas" class="form-label">Cantidad Personas *</label>
                                <input type="number" id="cantidadPersonas" class="form-control" min="1" required>
                            </div>
                            <div class="col-md-4">
                                <label for="cantidadHoras" class="form-label">Cantidad Horas (1-24) *</label>
                                <input type="number" id="cantidadHoras" class="form-control" min="1" max="24" required>
                            </div>
                            <div class="col-md-4">
                                <label for="estado" class="form-label">Estado *</label>
                                <select id="estado" class="form-select" required>
                                    <option value="PENDIENTE">PENDIENTE</option>
                                    <option value="CONFIRMADO">CONFIRMADO</option>
                                    <option value="FINALIZADO">FINALIZADO</option>
                                    <option value="CANCELADO">CANCELADO</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Evento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/controllers/indexController.js"></script>
</body>
</html>
